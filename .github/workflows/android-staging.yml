name: Android staging APK

on:
  workflow_run:
    workflows: ["Pilot CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_channel:
        description: Repair the download channel from an existing published APK without rebuilding
        type: boolean
        default: false
      publish:
        description: Publish a new version and update the staging download (requires a version bump)
        type: boolean
        default: false
      prefill:
        description: Include the existing shared Maya tester login
        type: boolean
        default: true

concurrency:
  group: android-staging-delivery
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "true"

jobs:
  verify-source:
    name: Verify main passed CI
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build: ${{ steps.source.outputs.build }}
      repair: ${{ steps.source.outputs.repair }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify trusted CI source and new release version
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/plan-android-release.mjs

  repair-channel:
    name: Recover published APK download channel
    needs: verify-source
    if: needs.verify-source.outputs.repair == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a moved main branch
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore channel from immutable verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DUIT_SIGNING_CERT_SHA256: ${{ secrets.DUIT_SIGNING_CERT_SHA256 }}
        run: node scripts/sync-staging-channel.mjs

  build:
    name: Build signed Samsung APK
    needs: verify-source
    if: needs.verify-source.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-staging
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_API_URL: https://duit-cards-staging.onrender.com/api/v1
      DUIT_DEMO_PREFILL: ${{ (github.event_name == 'workflow_run' || inputs.prefill) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a moved main branch
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tooling
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check build safeguards
        run: npm run test:tooling
      - name: Restore existing signing identity
        env:
          DUIT_KEYSTORE_BASE64: ${{ secrets.DUIT_KEYSTORE_BASE64 }}
          DUIT_STORE_PASSWORD: ${{ secrets.DUIT_STORE_PASSWORD }}
          DUIT_KEY_PASSWORD: ${{ secrets.DUIT_KEY_PASSWORD }}
          DUIT_SIGNING_CERT_SHA256: ${{ secrets.DUIT_SIGNING_CERT_SHA256 }}
        run: node scripts/restore-cloud-signing.mjs
      - name: Build and verify APK
        env:
          DUIT_SIGNING_CERT_SHA256: ${{ secrets.DUIT_SIGNING_CERT_SHA256 }}
          DUIT_DEMO_EMAIL: ${{ secrets.DUIT_DEMO_EMAIL }}
          DUIT_DEMO_PASSWORD: ${{ secrets.DUIT_DEMO_PASSWORD }}
        run: npm run build:apk
      - name: Prepare named download and build provenance
        env:
          PREFILL: ${{ env.DUIT_DEMO_PREFILL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloud-download
          if [ "$PREFILL" = true ]; then
            cp artifacts/android-build-private.json artifacts/cloud-download/android-build.json
          else
            cp artifacts/android-build.json artifacts/cloud-download/android-build.json
          fi
          APK_NAME=$(node -p "require('./artifacts/cloud-download/android-build.json').fileName")
          cp "artifacts/$APK_NAME" "artifacts/cloud-download/$APK_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: DUIT-Android-${{ needs.verify-source.outputs.sha }}
          path: artifacts/cloud-download/
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified version to staging channel
        if: github.event_name == 'workflow_run' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:apk -- --existing
      - name: Delivery summary
        env:
          PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
          SOURCE_SHA: ${{ needs.verify-source.outputs.sha }}
        run: |
          {
            echo '## Verified DUIT APK'
            echo "Source commit: $SOURCE_SHA"
            echo 'Download the DUIT-Android artifact below, extract the ZIP, and install the versioned DUIT-2026-<version>.apk on your Samsung.'
            echo 'It uses the existing signing identity and the hosted staging server; the laptop can be off.'
            if [ "$PUBLISH" = true ]; then
              echo 'Published: https://duit-cards-staging.onrender.com/download'
            else
              echo 'Build only: the existing staging-latest release was not changed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner signing files
        if: always()
        run: rm -rf .local/signing
