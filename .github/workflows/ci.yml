name: Pilot CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "true"

jobs:
  security-gate:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  quality-gates:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duit
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: duit_2026_pilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U duit -d duit_2026_pilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://duit:ci-only-password@localhost:5432/duit_2026_pilot_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Mobile and isolated API/provider checks
        run: npm test
      - name: Build public website
        run: npm run build:public
      - name: Build mobile browser bundle
        run: npm run build:web
      - name: Upload browser builds
        uses: actions/upload-artifact@v4
        with:
          name: pilot-browser-builds
          path: |
            apps/mobile/dist
            apps/web/dist
          if-no-files-found: error
          retention-days: 7
